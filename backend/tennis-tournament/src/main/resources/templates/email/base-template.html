<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Tournament Application</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      background-color: #4CAF50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .content {
      padding: 20px;
      background-color: #f9f9f9;
    }
    .footer {
      background-color: #f1f1f1;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }
    .btn {
      display: inline-block;
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 4px;
      margin: 10px 0;
    }
    .status-approved {
      color: #4CAF50;
      font-weight: bold;
    }
    .status-rejected {
      color: #F44336;
      font-weight: bold;
    }
    .status-waitlisted {
      color: #FF9800;
      font-weight: bold;
    }
    .status-pending {
      color: #2196F3;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Tennis Tournament</h1>
  </div>

  <div class="content">
    <!-- Main content will be inserted here by each template -->
    <div th:replace="${content}">Content goes here</div>
  </div>

  <div class="footer">
    <p>&copy; 2025 Tennis Tournament Management System. All rights reserved.</p>
    <p>This is an automated email. Please do not reply to this message.</p>
  </div>
</div>
</body>
</html>
